# ============================================================
# FinFlow Data Platform — Core Infrastructure
# ============================================================
# Usage:
#   docker compose up -d
#   docker compose ps
#   docker compose down
# ============================================================

services:

  # ============================================================
  # PostgreSQL (Source Database)
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: finflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - finflow-pg-data:/var/lib/postgresql/data
      - ./sources/postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=4
      - -c
      - max_replication_slots=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - finflow-network

  # ============================================================
  # MinIO (S3-Compatible Data Lake)
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: finflow-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - finflow-minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - finflow-network

  # ============================================================
  # MinIO Bucket Init (One-shot)
  # ============================================================
  minio-init:
    image: minio/mc:latest
    container_name: finflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW}
      MINIO_BUCKET_BRONZE: ${MINIO_BUCKET_BRONZE}
      MINIO_BUCKET_SILVER: ${MINIO_BUCKET_SILVER}
      MINIO_BUCKET_GOLD: ${MINIO_BUCKET_GOLD}
      MINIO_BUCKET_QUARANTINE: ${MINIO_BUCKET_QUARANTINE}
    volumes:
      - ./lake/scripts/create-buckets.sh:/init/create-buckets.sh:ro
    entrypoint: /bin/sh /init/create-buckets.sh
    networks:
      - finflow-network

  # ============================================================
  # Apache Kafka (KRaft Mode)
  # ============================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: finflow-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    ports:
      - "29092:29092"
    volumes:
      - finflow-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - finflow-network

  # ============================================================
  # Kafka Connect + Debezium
  # ============================================================
  kafka-connect:
    image: debezium/connect:2.5
    container_name: finflow-kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: finflow-connect-cluster
      CONFIG_STORAGE_TOPIC: finflow_connect_configs
      OFFSET_STORAGE_TOPIC: finflow_connect_offsets
      STATUS_STORAGE_TOPIC: finflow_connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks:
      - finflow-network

  # ============================================================
  # ClickHouse (Analytical Warehouse)
  # ============================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: finflow-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ports:
      - "${CLICKHOUSE_PORT:-8123}:8123"
      - "9010:9000"
    volumes:
      - finflow-ch-data:/var/lib/clickhouse
      - finflow-ch-logs:/var/log/clickhouse-server
      - ./clickhouse/config:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/users:/etc/clickhouse-server/users.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - finflow-network

  # ============================================================
  # Redis (Airflow Broker)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: finflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - finflow-network

# ============================================================
# Volumes
# ============================================================
volumes:
  finflow-pg-data:
  finflow-minio-data:
  finflow-kafka-data:
  finflow-ch-data:
  finflow-ch-logs:

# ============================================================
# Networks
# ============================================================
networks:
  finflow-network:
    name: finflow-network
    driver: bridge

